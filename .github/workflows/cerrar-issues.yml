name: Cerrar issues integrados
on:
  push:
    branches: [develop]
permissions:
  contents: read
  issues: write
jobs:
  cerrar:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          printf '%s' "$COMMITS" | jq -r '.[].message' \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -u \
            | while read -r n; do
                gh issue close "$n" --repo "$REPO" --reason completed --comment "Integrado en develop ($GITHUB_SHA)." || true
              done

name: Publicar
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Release con las notas del tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notas.md
          if [ -s notas.md ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notas.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

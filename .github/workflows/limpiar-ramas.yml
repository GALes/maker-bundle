name: Limpiar ramas integradas
on:
  push:
    branches: [develop]
permissions:
  contents: write
jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git for-each-ref --merged origin/develop --format='%(refname:lstrip=3)' refs/remotes/origin \
            | grep -vxE 'HEAD|develop|master|main' \
            | while read -r rama; do git push origin --delete "$rama"; done
